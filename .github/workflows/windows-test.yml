name: Windows test

# Builds the Windows app, runs it on a real Windows machine, checks it works and keeps screenshots.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (self-contained, single file)
        shell: pwsh
        run: dotnet publish windows/Memo.csproj -c Release -o out/Memo

      - name: Run and check
        shell: pwsh
        run: ./windows/ci/test.ps1 -Exe out/Memo/Memo.exe -Shots shots

      - name: Keep the app logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Copy-Item "shots/data/*.log" shots -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\Memo\*.log" shots -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Memo-screenshots
          path: shots
          retention-days: 14

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path out/Memo/* -DestinationPath Memo-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-windows
          path: Memo-windows.zip
          retention-days: 14
